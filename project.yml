name: Pinna
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.8.2"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pinna:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - target: PinnaWidgets
    info:
      path: Pinna-Info.plist
      properties:
        # Keep the Bluetooth link to the earbuds while the app is closed, so
        # controls are ready as soon as it is opened.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zasaonsk.pinna
        PRODUCT_NAME: Pinna
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Pinna.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Pinna
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Pinna connects to your Galaxy Buds over Bluetooth to control them and show their battery and volume.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  # Home Screen / Lock Screen widgets and Control Center controls (iOS 18).
  PinnaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/Shared
      - Sources/Protocol/BudsModel.swift
      - Sources/App/Localization.swift
      - Sources/Resources
    info:
      path: PinnaWidgets-Info.plist
      properties:
        CFBundleDisplayName: Pinna
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zasaonsk.pinna.widgets
        PRODUCT_NAME: PinnaWidgets
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Pinna.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
